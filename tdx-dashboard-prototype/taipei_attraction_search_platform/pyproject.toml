[project]
name = "taipei-attraction-search-platform"
version = "1.0.0"
description = "Taipei-only multi-source attraction search platform client"
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110.0", "uvicorn>=0.27.0"]
test = ["pytest>=8.0.0"]

[project.scripts]
taipei-attractions = "taipei_attraction_platform.__main__:main"
