<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taipei Attraction Route Planner - Mapbox</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-theme="light">
    <main class="app-shell">
      <section class="workspace">
        <button id="panelToggle" class="panel-bookmark" type="button">設定</button>
        <aside class="planner-panel" aria-label="Route planner controls">
          <header class="panel-top">
            <p class="eyebrow">Mapbox Frontend + Google Backend</p>
            <h1>臺北景點路線規劃</h1>
            <p>Mapbox 負責互動地圖，Google Maps Platform 在後端處理地理編碼與路線。</p>
          </header>

          <section class="status-card">
            <span>系統狀態</span>
            <strong id="systemStatus">載入中</strong>
          </section>

          <section class="control-card">
            <div class="section-title">
              <h2>地圖外觀</h2>
              <small id="themeLabel">Light</small>
            </div>
            <div class="theme-grid" role="group" aria-label="Map appearance">
              <button class="theme-button is-active" type="button" data-theme="light">Light</button>
              <button class="theme-button" type="button" data-theme="dark">Dark</button>
            </div>
          </section>

          <section class="control-card">
            <label for="searchInput">搜尋景點或行政區</label>
            <div class="search-row">
              <input id="searchInput" type="search" autocomplete="off" placeholder="例如：台北101、北投、夜市" />
              <button id="refreshButton" type="button">更新</button>
            </div>
          </section>

          <section class="control-card">
            <div class="section-title">
              <h2>出發位置</h2>
              <small id="originLabel">尚未取得位置</small>
            </div>
            <div class="location-grid">
              <button id="locateButton" type="button">取得目前位置</button>
              <button id="setMapCenterButton" type="button">使用地圖中心</button>
            </div>
          </section>

          <section class="control-card">
            <div class="section-title">
              <h2>交通方式</h2>
              <small id="travelModeLabel">大眾運輸</small>
            </div>
            <div class="mode-grid" role="group" aria-label="Travel mode">
              <button class="mode-button is-active" type="button" data-mode="TRANSIT">大眾運輸</button>
              <button class="mode-button" type="button" data-mode="WALKING">步行</button>
              <button class="mode-button" type="button" data-mode="DRIVING">開車</button>
            </div>
          </section>

          <section class="control-card attraction-picker">
            <div class="section-title">
              <h2>景點</h2>
              <small id="resultCount">0 筆</small>
            </div>
            <select id="attractionSelect">
              <option value="">請選擇目的地</option>
            </select>
          </section>
        </aside>

        <section class="map-panel" aria-label="Route map">
          <div id="map" class="map"></div>
          <div class="map-crosshair" aria-hidden="true"></div>
          <aside class="route-card">
            <button id="routeCardToggle" class="route-toggle" type="button">路線資訊</button>
            <div>
              <p id="selectedDestination">尚未選擇目的地</p>
              <h2 id="routeTitle">等待路線規劃</h2>
            </div>
            <dl>
              <div>
                <dt>距離</dt>
                <dd id="routeDistance">--</dd>
              </div>
              <div>
                <dt>時間</dt>
                <dd id="routeDuration">--</dd>
              </div>
              <div>
                <dt>終點地址</dt>
                <dd id="routeAddress">--</dd>
              </div>
            </dl>
          </aside>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
